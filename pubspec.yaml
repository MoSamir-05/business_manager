
name: business_manager
description: "Offline Business Manager App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Local Database
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6

  # Local Settings and Security
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6

  # Images
  image_picker: ^1.2.4

  # Barcode Scanner
  mobile_scanner: ^7.5.0

  # PDF and Excel Export
  pdf: 3.12.0
  printing: 5.14.3
  excel: ^4.0.6

  # Backup and Restore
  file_picker: ^13.3.2
  archive: ^3.6.1

  # Charts
  fl_chart: ^1.3.0

  # Date and Number Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
